# Disposable S3 API emulator for local development, not an AWS deployment.
services:
  moto:
    image: motoserver/moto:5.2.5
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/',timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 25
  s3-init:
    image: motoserver/moto:5.2.5
    entrypoint: [python, -c]
    command:
      - "import boto3; s=boto3.client('s3',endpoint_url='http://moto:5000',region_name='us-east-1',aws_access_key_id='relay-local',aws_secret_access_key='relay-local'); s.create_bucket(Bucket='relay-lab')"
    depends_on:
      moto:
        condition: service_healthy
  app:
    environment:
      STORAGE: s3
      S3_BUCKET: relay-lab
      S3_ENDPOINT: http://moto:5000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: relay-local
      AWS_SECRET_ACCESS_KEY: relay-local
    depends_on:
      s3-init:
        condition: service_completed_successfully
