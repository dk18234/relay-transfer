services:
  postgres:
    image: postgres:16.16
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - relay-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U relay -d relay"]
      interval: 3s
      timeout: 3s
      retries: 25
  app:
    build: .
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      DATABASE_URL: jdbc:postgresql://postgres:5432/relay
      DATABASE_USER: relay
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      STORAGE: local
    volumes:
      - relay-bytes:/data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped
volumes:
  relay-postgres:
  relay-bytes:
