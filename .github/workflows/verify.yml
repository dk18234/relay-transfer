name: Verify transfer contracts
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "LICENSE"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      S3_ENDPOINT: http://127.0.0.1:5000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start the S3 API emulator
        run: |
          pip install 'moto[server,s3]==5.2.5'
          moto_server -H 127.0.0.1 -p 5000 >/tmp/relay-moto.log 2>&1 &
          python -c "import urllib.request,time; time.sleep(2); urllib.request.urlopen('http://127.0.0.1:5000/')"
      - name: PostgreSQL contracts and packaged-process restart tests
        run: ./mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser hashing and transfer-domain checks
        run: |
          node --test scripts/browser-domain.test.mjs
          node --check src/main/resources/static/app.mjs
          python scripts/package_demo.py
          git diff --exit-code -- docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-verification-evidence
          path: |
            target/evidence
            target/surefire-reports
            target/failsafe-reports
            /tmp/relay-moto.log
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the full local storage stack
        run: |
          python -c "import secrets,pathlib; pathlib.Path('.env').write_text('ADMIN_TOKEN='+secrets.token_hex(32)+'\nDATABASE_PASSWORD='+secrets.token_hex(32)+'\n')"
          docker compose up --build -d
      - name: Check the actual container through HTTP
        run: python scripts/container_smoke.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the disposable stack
        if: always()
        run: docker compose down
